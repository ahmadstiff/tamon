[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Monad docs explicitly instruct prague for solc 0.8.28. The intro page implies
# Fusaka/osaka, but prague is the documented-and-safe choice.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
